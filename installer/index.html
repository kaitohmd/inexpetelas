<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>INEXPETELAS</title><link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="window">
    <header><img src="../assets/thumb-up.svg" alt=""><span>INEXPETELAS</span></header>
    <section class="content">
      <div class="orb"><img src="../assets/thumb-up.svg" alt=""></div>
      <h1 id="title">Tudo pronto pra sua call?</h1>
      <p id="message">Instale o INEXPETELAS neste computador e entre na sala dos seus amigos.</p>
      <div class="progress" id="progress-wrap" hidden><div id="bar"></div></div>
      <div class="percent" id="percent" hidden></div>
      <button id="install">Instalar INEXPETELAS</button>
      <button class="secondary" id="downloads">Ver versões</button>
      <small>Instalação por usuário · sem pedir acesso de administrador</small>
    </section>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
